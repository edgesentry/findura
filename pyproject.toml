[project]
name = "findura"
dynamic = ["version"]
description = "Common inspection ontology and deterministic agent harness OSS core"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
    { name = "Yohei Onishi", email = "yohei.onishi11@gmail.com" },
]
maintainers = [
    { name = "EdgeSentry", email = "yohei.onishi11@gmail.com" },
]
keywords = [
    "inspection",
    "ontology",
    "building-inspection",
    "property-insurance",
    "insurance",
    "remediation",
    "audit",
    "evidence-pack",
    "agent-harness",
    "deterministic",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "jsonschema>=4.23.0",
    "psycopg[binary]>=3.2.3",
    "pyyaml>=6.0.2",
]

[project.urls]
Homepage = "https://github.com/edgesentry/findura"
Repository = "https://github.com/edgesentry/findura"
Issues = "https://github.com/edgesentry/findura/issues"

[project.scripts]
harness = "harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "harness/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["harness"]

[tool.hatch.build.targets.wheel.force-include]
"schema" = "harness/schema"
"profiles" = "harness/profiles"
"queries" = "harness/queries"
"mappings" = "harness/mappings"
"fixtures" = "harness/fixtures"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.0.1",
    "pytest>=8.3.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.7.1",
    "types-jsonschema>=4.26.0.20261006",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
]
ignore = [
    "E501",  # line too long (handled by formatter / long docstrings & SQL)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "--cov=harness",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=80",
]

[tool.coverage.run]
branch = true
source = ["harness"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.12"
files = ["harness"]
check_untyped_defs = true
disallow_untyped_defs = false
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
show_error_codes = true
