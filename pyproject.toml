[project]
name = "findura"
version = "0.1.0"
description = "Common inspection ontology and deterministic agent harness OSS core"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.23.0",
    "psycopg[binary]>=3.2.3",
    "pyyaml>=6.0.2",
]

[project.urls]
Homepage = "https://github.com/edgesentry/findura"
Repository = "https://github.com/edgesentry/findura"
Issues = "https://github.com/edgesentry/findura/issues"

[project.scripts]
harness = "harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]

[tool.hatch.build.targets.wheel.force-include]
"schema" = "harness/schema"
"profiles" = "harness/profiles"
"queries" = "harness/queries"
"mappings" = "harness/mappings"
"fixtures" = "harness/fixtures"

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "ruff>=0.7.1",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
]
ignore = [
    "E501",  # line too long (handled by formatter / long docstrings & SQL)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
