[project]
name = "inspectra"
version = "0.1.0"
description = "Common inspection ontology and deterministic agent harness OSS core"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.23.0",
    "psycopg[binary]>=3.2.3",
    "pyyaml>=6.0.2",
]

[project.scripts]
harness = "harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "ruff>=0.7.1",
]
