name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Build, Publish and Release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/findura
    permissions:
      id-token: write
      contents: write

    steps:
      - name: Checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init -q -b ci
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w 0)"
          git config --local "http.https://github.com/.extraheader" "AUTHORIZATION: basic ${auth}"
          git fetch --tags --depth=1 origin "+${GITHUB_REF}:refs/remotes/origin/ci"
          git checkout --force refs/remotes/origin/ci

      - name: Install uv
        run: |
          # Pinned to uv 0.13.6; bump by updating the version in this URL (see https://github.com/astral-sh/uv/releases)
          curl -LsSf https://astral.sh/uv/0.13.6/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Set up Python
        run: uv python install 3.12

      - name: Build package
        run: uv build

      - name: Publish package to PyPI
        run: uv publish

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          --repo "${{ github.repository }}"
          --generate-notes
          dist/*
