name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: findura
          POSTGRES_PASSWORD: findura_password
          POSTGRES_DB: findura
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git init -q -b ci
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w 0)"
          git config --local "http.https://github.com/.extraheader" "AUTHORIZATION: basic ${auth}"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            ref="refs/pull/${PR_NUMBER}/merge"
          else
            ref="${GITHUB_REF}"
          fi
          git fetch --no-tags --depth=1 origin "+${ref}:refs/remotes/origin/ci"
          git checkout --force refs/remotes/origin/ci

      - name: Install uv
        run: |
          # Pinned to uv 0.13.6; bump by updating the version in this URL (see https://github.com/astral-sh/uv/releases)
          curl -LsSf https://astral.sh/uv/0.13.6/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }}

      - name: Run code formatting check (ruff format)
        run: uv run ruff format --check .

      - name: Run static analysis (ruff check)
        run: uv run ruff check .

      - name: Run static type checking (mypy)
        run: uv run mypy

      - name: Run automated tests and coverage gate (pytest)
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: findura
          POSTGRES_PASSWORD: findura_password
          POSTGRES_DB: findura
        run: uv run pytest -v

      - name: Verify wheel packaging smoke test in clean environment
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: findura
          POSTGRES_PASSWORD: findura_password
          POSTGRES_DB: findura
        run: |
          uv build --wheel --out-dir /tmp/smoke-dist
          wheel_file=$(ls /tmp/smoke-dist/findura-*.whl | head -n 1)
          uv venv /tmp/smoke-env --python ${{ matrix.python-version }}
          uv pip install --python /tmp/smoke-env/bin/python "$wheel_file"
          cd /tmp
          /tmp/smoke-env/bin/python -c "
          from harness.db import get_connection, init_db
          from harness.query import run_insurer_query
          conn = get_connection()
          init_db(conn)
          res = run_insurer_query(conn, as_of='2026-10-27')
          assert 'open_findings' in res
          print('Clean installed wheel successfully ran init_db and insurer query outside git checkout!')
          "
          /tmp/smoke-env/bin/harness --help
