services:
  db:
    image: postgres:16-alpine
    container_name: findura-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: findura
      POSTGRES_PASSWORD: findura_password
      POSTGRES_DB: findura
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
